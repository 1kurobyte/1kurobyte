name: Build & deploy

# Builds every project's browser port from source (see projects.tsv) and
# publishes the desktop to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly, to pick up changes in the project repos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.10
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            grub-pc-bin grub-common xorriso mtools \
            flex bison bc libelf-dev libssl-dev cpio file ncurses-bin

      - name: Install Zig
        run: |
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          tar -xf "zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$PWD/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - uses: actions/cache@v4
        with:
          path: .work/downloads
          key: downloads-${{ hashFiles('ports/*/build.sh') }}
          restore-keys: downloads-

      - name: Build all projects
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
